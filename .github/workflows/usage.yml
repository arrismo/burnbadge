name: AI Usage Badge

on:
  schedule:
    - cron: '0 0 */10 * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync and show in the badge'
        required: false
        default: '10'

jobs:
  sync-usage:
    runs-on: ubuntu-latest
    name: Sync usage to burnbadge
    steps:
      - name: Push Codex usage to burnbadge
        id: sync
        run: |
          DAYS="${{ github.event.inputs.days || '10' }}"

          read -r START_TIME END_TIME <<EOF
          $(python3 - <<PY
          from datetime import datetime, timedelta, timezone
          days = int("${DAYS}")
          end = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          start = end - timedelta(days=days - 1)
          print(int(start.timestamp()), int((end + timedelta(days=1)).timestamp()))
          PY
          )
          EOF

          COSTS_RESPONSE=$(curl -fsS --get \
            -H "Authorization: Bearer ${OPENAI_ADMIN_KEY}" \
            -H "Accept: application/json" \
            --data-urlencode "start_time=${START_TIME}" \
            --data-urlencode "end_time=${END_TIME}" \
            --data-urlencode "bucket_width=1d" \
            --data-urlencode "limit=${DAYS}" \
            https://api.openai.com/v1/organization/costs)

          PAYLOAD=$(jq -n \
            --argjson costs "$COSTS_RESPONSE" \
            --arg provider "openai" '
              def round4:
                ((. * 10000) | round) / 10000;
              {
                provider: $provider,
                usage: (
                  ($costs.data // [])
                  | map({
                      date: (.start_time | gmtime | strftime("%Y-%m-%d")),
                      breakdown: (
                        (.results // [])
                        | map({
                            model: (.line_item // .project_id // "openai"),
                            cost: (.amount.value // 0 | round4)
                          })
                        | map(select(.cost > 0))
                      )
                    })
                  | map(. + { cost: (.breakdown | map(.cost) | add // 0 | round4) })
                  | map(select(.cost > 0))
                )
              }
            ')

          USAGE_COUNT=$(jq '.usage | length' <<< "$PAYLOAD")
          if [ "$USAGE_COUNT" -gt 0 ]; then
            curl -fsS -X POST "${BURNBADGE_BASE_URL}/api/usage/${BURNBADGE_USAGE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          else
            echo "No OpenAI costs found for the selected ${DAYS}-day window; skipping push."
          fi

          IMAGE_URL="${BURNBADGE_BASE_URL}/api/shields/${BURNBADGE_BADGE_TOKEN}/image?days=${DAYS}"
          MARKDOWN="![Codex Usage](${IMAGE_URL})"

          echo "image_url=${IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "markdown=${MARKDOWN}" >> "$GITHUB_OUTPUT"

          echo "Badge: ${IMAGE_URL}"
          echo "Markdown: ${MARKDOWN}"
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          BURNBADGE_BASE_URL: ${{ secrets.BURNBADGE_BASE_URL }}
          BURNBADGE_USAGE_TOKEN: ${{ secrets.BURNBADGE_USAGE_TOKEN }}
          BURNBADGE_BADGE_TOKEN: ${{ secrets.BURNBADGE_BADGE_TOKEN }}

      - name: Update job summary
        run: |
          echo "## AI Usage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.sync.outputs.markdown }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Data synced from your repository workflow to burnbadge*" >> $GITHUB_STEP_SUMMARY
