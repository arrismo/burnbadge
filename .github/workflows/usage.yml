name: AI Usage Badge

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync and show in the badge'
        required: false
        default: '7'

jobs:
  sync-usage:
    runs-on: ubuntu-latest
    name: Sync usage to burnbadge
    steps:
      - name: Push OpenRouter usage to burnbadge
        id: sync
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"

          ACTIVITY_RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Accept: application/json" \
            https://openrouter.ai/api/v1/activity)

          TODAY=$(date -u +%F)
          START_DATE=$(date -u -v-$((${DAYS} - 1))d +%F)

          PAYLOAD=$(jq -n \
            --argjson activity "$ACTIVITY_RESPONSE" \
            --arg provider "openrouter" \
            --arg start "$START_DATE" \
            --arg end "$TODAY" '
              def round4:
                ((. * 10000) | round) / 10000;
              {
                provider: $provider,
                usage: (
                  ($activity.data // [])
                  | map(select(.date != null))
                  | map({
                      date: (.date[0:10]),
                      model: (.model // "unknown"),
                      cost: (((.usage // 0) + (.byok_usage_inference // 0)) | round4)
                    })
                  | map(select(.date >= $start and .date <= $end))
                  | group_by(.date)
                  | map({
                      date: .[0].date,
                      cost: (map(.cost) | add | round4),
                      breakdown: (
                        group_by(.model)
                        | map({
                            model: .[0].model,
                            cost: (map(.cost) | add | round4)
                          })
                        | map(select(.cost > 0))
                      )
                    })
                )
              }
            ')

          curl -fsS -X POST "${BURNBADGE_BASE_URL}/api/usage/${BURNBADGE_USAGE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          IMAGE_URL="${BURNBADGE_BASE_URL}/api/shields/${BURNBADGE_BADGE_TOKEN}/image?days=${DAYS}"
          MARKDOWN="![AI Usage](${IMAGE_URL})"

          echo "image_url=${IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "markdown=${MARKDOWN}" >> "$GITHUB_OUTPUT"

          echo "Badge: ${IMAGE_URL}"
          echo "Markdown: ${MARKDOWN}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BURNBADGE_BASE_URL: ${{ secrets.BURNBADGE_BASE_URL }}
          BURNBADGE_USAGE_TOKEN: ${{ secrets.BURNBADGE_USAGE_TOKEN }}
          BURNBADGE_BADGE_TOKEN: ${{ secrets.BURNBADGE_BADGE_TOKEN }}

      - name: Update job summary
        run: |
          echo "## AI Usage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.sync.outputs.markdown }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Data synced from your repository workflow to burnbadge*" >> $GITHUB_STEP_SUMMARY
